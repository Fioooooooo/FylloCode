          --surface-2: #2f2e29;

          --text-2: #b4b2a9;
          --text-3: #807e76;
          --border: rgba(255, 255, 255, 0.12);
          --border-strong: rgba(255, 255, 255, 0.22);
          --read-bg: #0c447c;
          --read-fg: #b5d4f4;

          --search-fg: #9fe1cb;

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:

          "PingFang SC",
          "Segoe UI",
          "Microsoft YaHei",
          sans-serif;
      }
      main {
        max-width: 800px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 22px;
        font-weight: 600;
        margin: 0;
        line-height: 1.4;
      }
      .meta-line {
        font-size: 13px;
        color: var(--text-3);
        margin-top: 6px;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }
      .chip {
        font-size: 12px;
        padding: 3px 11px;
        border-radius: 99px;
        background: var(--surface-2);
        color: var(--text-2);
      }
      .chip.k-read {
        background: var(--read-bg);
        color: var(--read-fg);
      }
      .chip.k-edit {
        background: var(--edit-bg);
        color: var(--edit-fg);
      }
      .chip.k-exec {
        background: var(--exec-bg);
        color: var(--exec-fg);
      }
      .chip.k-search {
        background: var(--search-bg);
        color: var(--search-fg);
      }
      .chip.k-delegate {
        background: var(--dele-bg);
        color: var(--dele-fg);
      }

      nav.turn-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        gap: 2px;
        align-items: center;
        flex-wrap: wrap;
        margin: 24px -20px 0;
        padding: 8px 20px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(8px);
        border-bottom: 1px solid var(--border);
        font-size: 12px;
      }
      nav.turn-nav a {
        color: var(--text-2);
        text-decoration: none;
        padding: 3px 9px;
        border-radius: 6px;
        white-space: nowrap;
      }
      nav.turn-nav a:hover {
        background: var(--surface-2);
        color: var(--text);
      }
      nav.turn-nav .nav-count {
        color: var(--text-3);
        margin-right: 6px;
      }

      section.card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 22px;
        margin-top: 20px;
      }
      .sec-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 12px;
      }
      .sec-title {
        font-size: 12px;
        color: var(--text-3);
        letter-spacing: 0.06em;
      }
      .totals {
        font-size: 13px;
        color: var(--text-2);
        font-family: var(--mono);
      }
      .add {
        color: var(--add-fg);
      }
      .del {
        color: var(--del-fg);
      }

      details.group {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
      }
      details.group summary {
        display: flex;
        align-items: baseline;
        gap: 12px;
        padding: 8px 12px;
        cursor: pointer;
        list-style: none;
        font-size: 13px;
        font-family: var(--mono);
      }
      details.group summary > span:last-child {
        margin-left: auto;
      }
      details.group summary::-webkit-details-marker {
        display: none;
      }
      details.group summary::before {
        content: "▸";
        color: var(--text-3);
        margin-right: 6px;
      }
      details.group[open] summary::before {
        content: "▾";
      }
      details.group[open] summary {
        background: var(--surface-2);
        border-radius: 8px 8px 0 0;
      }
      .group-files {
        padding: 4px 12px 10px 34px;
        font-size: 13px;
        font-family: var(--mono);
      }
      .file-row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 3px 0;
      }
      .file-note {
        font-size: 11px;
        color: var(--text-3);
        font-family: inherit;
        margin-left: 8px;
      }
      .dim {
        color: var(--text-3);
      }

      .cmd-list {
        font-size: 13px;
        font-family: var(--mono);
        line-height: 2.1;
      }
      .cmd-ok::before {
        content: "✓ ";
        color: var(--ok);
      }
      .cmd-fail::before {
        content: "✗ ";
        color: var(--fail);
      }
      .aside-note {
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-3);
      }

      .phase {
        margin-top: 36px;
        display: flex;
        align-items: baseline;
        gap: 10px;
        flex-wrap: wrap;
      }
      .phase h2 {
        font-size: 15px;
        font-weight: 600;
        margin: 0;
      }
      .phase .pd {
        font-size: 12px;
        color: var(--text-3);
      }

        font-size: 11px;
        padding: 1px 8px;
        border-radius: 99px;
        background: var(--revert-bg);
        color: var(--revert-fg);
      }

      .turn {
        margin-top: 22px;
        padding-left: 20px;
        border-left: 2px solid var(--border);
      }
      .turn-label {
        font-size: 12px;
        color: var(--text-3);
        margin-bottom: 8px;
      }
      .prompt {
        background: var(--surface-2);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 14px;
      }
      .injected-note {
        font-size: 12px;
        color: var(--text-3);
        margin-top: 6px;
      }
      .acts {

        flex-wrap: wrap;
        gap: 6px;
        margin-top: 12px;
      }

        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
      }
      details.act[open] {
        flex-basis: 100%;
      }

        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        padding: 4px 11px;
        border-radius: 7px;
        border: 1px solid var(--border);
        color: var(--text-2);
        cursor: pointer;
        list-style: none;
        user-select: none;
      }
      details.act > summary::-webkit-details-marker {
        display: none;
      }
      details.act > summary::after {
        content: "▾";
        font-size: 10px;
        opacity: 0.6;
      }
      details.act[open] > summary::after {
        content: "▴";
      }

        color: var(--edit-fg);
        border-color: var(--edit-bd);
      }
      details.act.k-delegate > summary {
        background: var(--dele-bg);
        color: var(--dele-fg);
      }

        width: 100%;
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 10px 14px;
        font-size: 12px;
        margin: 2px 0 4px;

      .act-body .head {
        color: var(--text-2);
        margin-bottom: 6px;
      }
      .act-items {
        line-height: 2;
        font-family: var(--mono);
        font-size: 12px;
      }
      .more-line {
        color: var(--text-3);
        font-size: 12px;
        margin-top: 2px;
      }
      .diff {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.9;
        margin: 6px 0;
      }
      .diff div {
        padding: 0 8px;
        white-space: pre-wrap;
      }
      .diff .l-add {
        background: var(--add-bg);
        color: var(--add-fg);
      }
      .diff .l-del {
        background: var(--del-bg);
        color: var(--del-fg);
      }
      .diff .l-ctx {
        color: var(--text-3);
      }
      .out {
        font-family: var(--mono);
        font-size: 12px;
        line-height: 1.7;
        background: var(--surface-2);
        border-radius: 6px;
        padding: 8px 12px;
        white-space: pre-wrap;
        margin: 6px 0;
      }
      .out .snip {
        color: var(--text-3);
        font-style: italic;
      }
      .evidence {
        color: var(--text-3);
        font-size: 11px;
        margin-top: 6px;
        font-family: var(--mono);
      }

      .reasoning {
        display: none;
        margin-top: 12px;
        padding: 8px 14px;
        border-left: 3px solid var(--border-strong);
        font-size: 13px;
        color: var(--text-3);
        font-style: italic;
      }
      body.show-reasoning .reasoning {
        display: block;
      }

      .response {
        margin-top: 14px;
        font-family: var(--serif);
        font-size: 15.5px;
        line-height: 1.85;
      }
      .response p {
        margin: 0 0 0.8em;
      }
      .response p:last-child {
        margin-bottom: 0;
      }
      .response code {
        font-family: var(--mono);
        font-size: 13px;
        background: var(--surface-2);
        border-radius: 4px;
        padding: 1px 5px;
      }

      details.tc {
        margin-top: 10px;
        padding-left: 20px;
        border-left: 2px solid var(--border);
      }
      details.tc > summary {
        display: flex;
        align-items: baseline;
        gap: 10px;
        cursor: pointer;
        list-style: none;
        font-size: 13px;
        padding: 6px 0;
      }
      details.tc > summary::-webkit-details-marker {
        display: none;
      }
      details.tc .tl {
        color: var(--text-3);
        font-size: 12px;
        white-space: nowrap;
      }
      details.tc .tp {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text-2);
      }
      details.tc .tchips {
        color: var(--text-3);
        font-size: 12px;
        white-space: nowrap;
        font-family: var(--mono);
      }
      details.tc .tc-body {
        font-size: 13.5px;
        color: var(--text-2);
        font-family: var(--serif);
        padding: 4px 0 10px;
        line-height: 1.8;
      }

      footer.audit {
        margin-top: 44px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-3);
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 8px 24px;
      }
      footer.audit label {
        cursor: pointer;
        user-select: none;
        color: var(--text-2);
      }
      footer.audit .hash {
        font-family: var(--mono);
      }

    <script>

          );
        const stat = (n) =>
          n >= 1000000
            ? (n / 1000000).toFixed(1) + "M"
            : n >= 1000
              ? Math.round(n / 1000) + "k"
              : String(n);
        const KIND = {
          read: { cls: "k-read", icon: "◉", label: "读取" },

        };
        const md = (text) =>
          esc(text)
            .split("\n\n")
            .map((p) => "<p>" + p.replace(/`([^`]+)`/g, "<code>$1</code>") + "</p>")
            .join("");
        const diffStat = (a, r) =>
          (a ? '<span class="add">+' + a + "</span> " : "") +
          (r ? '<span class="del">−' + r + "</span>" : "");

        function renderHeader(m) {
          const chips = Object.entries(m.kindStats)
            .map(([k, n]) => {
              const d = KIND[k];
              return (
                '<span class="chip ' + d.cls + '">' + d.icon + " " + d.label + " " + n + "</span>"

            })
            .join("");
          const cost = m.tokenUsage.cost;
          const hours = (m.durationMin / 60).toFixed(1);
          return (
            "<header><h1>" +
            esc(m.title) +
            "</h1>" +
            '<p class="meta-line">' +
            [
              m.agent,
              m.sessionMode + " 模式",
              m.createdAt,
              hours + " 小时",
              m.workspace + " 工作区",

              .map(esc)
              .join(" · ") +
            "</p>" +
            '<div class="chips"><span class="chip">' +
            m.turnCount +
            " 轮对话</span>" +
            chips +
            '<span class="chip">' +
            stat(m.tokenUsage.used) +
            " tokens · $" +
            cost.amount.toFixed(2) +
            "</span></div></header>"

          return (
            '<section class="card"><div class="sec-head"><span class="sec-title">这次会话改了什么</span>' +
            '<span class="totals">' +
            c.totals.files +
            " 个文件 · " +
            diffStat(c.totals.added, c.totals.removed) +
            "</span></div>" +
            groups +
            (c.note ? '<p class="aside-note">↩ ' + esc(c.note) + "</p>" : "") +
            '<div class="sec-head" style="margin-top:18px"><span class="sec-title">关键命令</span>' +
            '<span class="totals dim">' +
            esc(data.commandNote) +
            "</span></div>" +
            '<div class="cmd-list">' +
            cmdRows +
            "</div>" +
            '<p class="aside-note">另读取 ' +
            data.readCount +
            " 个文件、共执行 " +
            data.commandCount +
            " 条命令 — 见下方时间线。完整代码变更请以 git / proposal 为准。</p></section>"
          );
        }

        function renderActivity(a) {
          const d = KIND[a.kind];
          let body = "";
          if (a.items) {
            body =
              '<div class="act-body"><div class="act-items">' +
              a.items.map((it) => "<div>" + esc(it.label) + "</div>").join("") +
              "</div>" +
              (a.more ? '<div class="more-line">…还有 ' + a.more + " 条，见原始记录</div>" : "") +
              '<div class="evidence">证据：' +
              esc(a.evidence) +
              "</div></div>";
          } else if (a.detail && a.kind === "edit") {
            const t = a.detail;
            body =
              '<div class="act-body"><div class="head">Edit · ' +
              esc(t.file) +
              " · " +
              diffStat(t.added, t.removed) +
              (t.editCount > 1
                ? ' <span class="dim">（本轮共 ' + t.editCount + " 次，示例为其一）</span>"
                : "") +
              "</div>" +
              '<div class="diff">' +
              t.snippet
                .map(([kind, line]) => {
                  const cls = kind === "add" ? "l-add" : kind === "del" ? "l-del" : "l-ctx";
                  const sign = kind === "add" ? "+ " : kind === "del" ? "− " : "  ";
                  return '<div class="' + cls + '">' + sign + esc(line) + "</div>";
                })
                .join("") +
              '</div><div class="evidence">证据：' +
              esc(a.evidence) +
              "</div></div>";
          } else if (a.detail) {
            const t = a.detail;
            body =
              '<div class="act-body"><div class="head">' +
              (t.ok ? "✓" : "✗") +
              " " +
              esc(t.command) +
              "</div>" +
              '<div class="out">' +
              esc(t.outputHead) +
              (t.outputTail ? '\n<span class="snip">…</span>\n' + esc(t.outputTail) : "") +
              "</div>" +
              '<div class="evidence">证据：' +
              esc(a.evidence) +
              " · 完整输出 " +
              esc(t.hash) +
              "</div></div>";
          }
          return (
            '<details class="act ' +
            d.cls +
            '"><summary>' +
            d.icon +
            " " +
            esc(a.summary) +
            "</summary>" +
            body +
            "</details>"
          );
        }

        function renderBlocks(blocks) {
          return blocks
            .map((b) =>
              b.t === "acts"
                ? '<div class="acts">' + b.a.map(renderActivity).join("") + "</div>"
                : '<div class="response">' + md(b.x) + "</div>"
            )
            .join("");
        }

        function renderTurn(t) {
          let html = "";
          if (t.phase) {
            html +=
              '<div class="phase" id="phase-' +
              t.phase.id +
              '"><h2>' +
              esc(t.phase.title) +
              "</h2>" +
              (t.phase.reverted ? '<span class="badge-revert">已回退</span>' : "") +
              '<span class="pd">' +
              esc(t.phase.digest) +
              "</span></div>";
          }
          if (t.lite) {
            html +=
              '<details class="tc"><summary><span class="tl">第 ' +
              t.n +
              ' 轮</span><span class="tp">' +
              esc(t.prompt) +
              '</span><span class="tchips">' +
              esc(t.lite.chips) +
              "</span></summary>" +
              '<div class="tc-body">' +
              esc(t.lite.one) +
              "</div></details>";
            return html;
          }
          html +=
            '<article class="turn" id="turn-' +
            t.n +
            '">' +
            '<p class="turn-label">第 ' +
            t.n +
            " 轮 · 用户" +
            (t.revert ? ' <span class="badge-revert">回退</span>' : "") +
            "</p>" +
            '<div class="prompt">' +
            esc(t.prompt) +
            "</div>" +
            (t.injectedNote ? '<p class="injected-note">' + esc(t.injectedNote) + "</p>" : "") +
            (t.reasoning || []).map((r) => '<div class="reasoning">' + esc(r) + "</div>").join("") +
            renderBlocks(t.blocks) +
            "</article>";
          return html;
        }

        function renderAudit(a) {
          return (
            '<footer class="audit" id="audit"><span>已脱敏：' +
            a.redactions.map(esc).join(" · ") +
            '</span><span class="hash">原始记录 ' +
            esc(a.sourceHash) +
            "</span>" +
            "<span>导出于 " +
            esc(a.exportedAt) +
            " · " +
            esc(a.generator) +
            "</span>" +
            '<label><input type="checkbox" id="toggle-reasoning" /> 显示思考过程</label></footer>'
          );
        }

        document.getElementById("app").innerHTML =
          renderHeader(data.meta) +
          renderNav(data.phases) +
          renderChanges(data.changes, data.commands) +
          '<div class="sec-title" style="margin-top:28px">时间线 · 关键轮全文展示，常规轮折叠为单行</div>' +
          data.turns.map(renderTurn).join("") +
          renderAudit(data.audit);

        document.getElementById("toggle-reasoning").addEventListener("change", (e) => {
          document.body.classList.toggle("show-reasoning", e.target.checked);
        });
      })();
    </script>
  </body>
</html>
