<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>FylloCode App Icon</title>
  <defs>
    <filter id="app-icon-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow
        in="SourceAlpha"
        dx="0"
        dy="6"
        stdDeviation="5"
        flood-color="#000"
        flood-opacity="0.18"
        result="contact-shadow"
      />
      <feDropShadow
        in="SourceAlpha"
        dx="0"
        dy="16"
        stdDeviation="12"
        flood-color="#000"
        flood-opacity="0.12"
        result="depth-shadow"
      />
      <feMerge>
        <feMergeNode in="depth-shadow"/>
        <feMergeNode in="contact-shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>
  <g filter="url(#app-icon-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="184" fill="#fff"/>
    <rect
      x="102"
      y="102"
      width="820"
      height="820"
      rx="182"
      fill="none"
      stroke="#e5e7eb"
      stroke-width="4"
      stroke-opacity="0.7"
    />
  </g>
  <image
    data-icon-source="icon.svg"
    href="data:image/svg+xml;base64,"
    x="199.237"
    y="272.327"
    width="625.39"
    height="543.878"
    filter="url(#shadow)"
  />
</svg>
